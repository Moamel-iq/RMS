# Render Blueprint for the production restaurant system.
# It creates paid resources only when you explicitly apply this Blueprint in
# your own Render account. No secret is stored in this file.
services:
  - type: web
    name: khan-mandi-rms-web
    runtime: docker
    region: frankfurt
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz/
    # Render only accepts a direct executable command here. The command owns
    # retrying a newly created database, migrations, and access synchronization.
    preDeployCommand: python manage.py prepare_render_deploy
    disk:
      name: private-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: khan-mandi-rms-web.onrender.com
      - key: DJANGO_USE_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DATABASE_URL
        fromDatabase:
          name: khan-mandi-rms-db
          property: connectionString
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_CONN_MAX_AGE
        value: "60"
      # The username is safe to keep in the deployment configuration. The
      # password is intentionally never committed; it is needed only if the
      # account does not already exist on a new production database.
      - key: RENDER_OWNER_USERNAME
        value: moamel
      - key: RENDER_OWNER_PASSWORD
        sync: false

databases:
  - name: khan-mandi-rms-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: khan_mandi
    user: khan_mandi
    ipAllowList: []
