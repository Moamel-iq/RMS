# Render Blueprint for the production restaurant system.
# It creates paid resources only when you explicitly apply this Blueprint in
# your own Render account. No secret is stored in this file.
services:
  - type: web
    name: jadwa-rms-web
    runtime: docker
    region: frankfurt
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz/
    # A database created by this same blueprint is still starting when the
    # first deploy reaches this step, and `migrate` fails on a refused
    # connection. Retrying is safe: a refused connection runs nothing, and
    # a migration that did run is recorded and skipped on the next attempt.
    preDeployCommand: >-
      sh -c 'attempt=1; while [ $attempt -le 20 ]; do
      python manage.py migrate --noinput && exit 0;
      echo "database not reachable yet (attempt $attempt of 20); waiting 15s";
      attempt=$((attempt + 1)); sleep 15;
      done; echo "the database never became reachable"; exit 1'
    disk:
      name: private-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: jadwa-rms-web.onrender.com
      - key: DJANGO_USE_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DATABASE_URL
        fromDatabase:
          name: khan-mandi-rms-db
          property: connectionString
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DB_CONN_MAX_AGE
        value: "60"

databases:
  - name: khan-mandi-rms-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    databaseName: khan_mandi
    user: khan_mandi
    ipAllowList: []
