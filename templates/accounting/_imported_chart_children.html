{% load i18n money_tags %}
{% for account in children %}
  <tr class="ui-account-tree__row ui-account-tree__row--child" data-node-id="{{ account.pk }}" data-parent="{{ parent.pk }}">
    <td data-label="{% translate 'الرمز' %}">{% if account.child_count %}<button class="ui-tree-toggle" type="button" data-account-tree-toggle data-node-id="{{ account.pk }}" data-label-open="{% translate 'فتح الفروع' %}" data-label-close="{% translate 'إغلاق الفروع' %}" hx-get="{% url 'accounting:imported_chart_children' account.pk %}" hx-target="closest tr" hx-swap="afterend" hx-sync="this:drop" aria-expanded="false" aria-label="{% translate 'فتح الفروع' %}">+</button>{% else %}<span class="ui-account-tree__spacer" aria-hidden="true"></span>{% endif %}<bdi dir="ltr"><code>{{ account.source_code }}</code></bdi></td>
    <td data-label="{% translate 'اسم الحساب' %}">{{ account.name }}</td>
    <td class="ui-account-tree__balance" data-label="{% translate 'الرصيد' %}"><bdi dir="ltr">{{ account.source_balance|money_full }}</bdi></td>
  </tr>
{% empty %}
  <tr data-parent="{{ parent.pk }}"><td colspan="3" class="ui-table__empty">{% translate "لا توجد حسابات فرعية." %}</td></tr>
{% endfor %}
