{% load i18n %}
<div class="ui-field{% if field.errors %} ui-field--invalid{% endif %}{% if wide %} ui-field--wide{% endif %}" data-field>
  <label class="ui-field__label" for="{{ field.id_for_label }}">
    {{ field.label }}
    {% if field.field.required %}
      <span class="ui-field__required" aria-hidden="true">*</span>
      <span class="ui-sr-only"> — {% translate "مطلوب" %}</span>
    {% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<p class="ui-field__hint" id="{{ field.auto_id }}_ui-field__hint" data-field-description>{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}
    <div id="{{ field.auto_id }}_error" data-field-description data-field-error>
      {% for error in field.errors %}<p class="ui-field__error">{{ error }}</p>{% endfor %}
    </div>
  {% endif %}
</div>
