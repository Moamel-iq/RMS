<span class="ui-badge{% if status == 'POSTED' or status == 'ACTIVE' or status == 'APPLIED' or status == 'COMPLETED' %} ui-badge--success{% elif status == 'DRAFT' or status == 'PENDING' or status == 'UPLOADED' or status == 'IN_PROGRESS' or status == 'CLOSED_WITH_SHORTAGE' %} ui-badge--warning{% elif status == 'SUBMITTED' or status == 'VALIDATED' or status == 'DISPATCHED' or status == 'PARTIALLY_RECEIVED' %} ui-badge--info{% elif status == 'REVERSED' or status == 'ARCHIVED' or status == 'CANCELLED' %} ui-badge--neutral{% elif status == 'FAILED' or status == 'FAILED_VALIDATION' %} ui-badge--danger{% else %} ui-badge--neutral{% endif %}">
  <span class="ui-badge__dot" aria-hidden="true"></span>
  {{ label }}
</span>
